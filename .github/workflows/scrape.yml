name: Scrape Bin Collections

on:
  schedule:
    # Every Friday at 15:23 UTC (3:23 pm GMT / 4:23 pm BST)
    - cron: "23 15 * * 5"
    # Temporary test schedule — remove after verifying
    - cron: "38 17 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Scrape WasteWorks and regenerate HTML
        env:
          WASTE_PROPERTY_ID: ${{ secrets.WASTE_PROPERTY_ID }}
        run: python -m src.scraper

      - name: Commit and push updated data and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collections.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update bin collection schedule"
          git push
